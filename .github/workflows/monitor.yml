name: Coverage Monitor

on:
  schedule:
    # GitHub cron is UTC. 8 AM Toronto is 13:00 UTC in winter (EST) and 12:00 UTC in summer (EDT).
    # Both fire every Saturday; the code runs only in the one that lands at 8 AM Toronto.
    - cron: "0 12 * * 6"
    - cron: "0 13 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, write nothing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: coverage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write service account key to a temp file outside the repo
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          umask 077
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
      - name: Run monitor
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          EDGAR_CONTACT_EMAIL: ${{ secrets.EDGAR_CONTACT_EMAIL }}
          MONITOR_SHEET_ID: ${{ secrets.MONITOR_SHEET_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--scheduled"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m donwoods_monitor $ARGS
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest
          path: out/
          if-no-files-found: ignore
          retention-days: 30
