[project]
name = "donwoods-monitor"
version = "0.1.0"
description = "Weekly coverage monitor for Donwoods Capital"
requires-python = ">=3.12"
dependencies = [
  "gspread>=6.1",
  "google-auth>=2.30",
  "yfinance>=0.2.50",
  "requests>=2.32",
  "pandas>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
donwoods-monitor = "donwoods_monitor.cli:main"

[tool.setuptools]
packages = ["donwoods_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
